version: '3.8'

services:
  ytdlp-api:
    build: .
    container_name: ytdlp-api
    ports:
      - "8018:8018"
    volumes:
      - ./downloads:/tmp/ytdlp_api
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8018/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    network_mode: host 