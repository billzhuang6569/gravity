version: '3.8'

services:
  ytdlp-api:
    build: .
    container_name: ytdlp-api
    network_mode: host
    volumes:
      - ./downloads:/tmp/ytdlp_api
      - ./logs:/app/logs
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8018/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可选：添加Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: ytdlp-nginx
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - ytdlp-api
    restart: unless-stopped

volumes:
  downloads:
  logs: 