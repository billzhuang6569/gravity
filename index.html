<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Gravity Video Downloader - 现代化版本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 抽象背景容器 */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 毛玻璃主窗口 */
        .glass-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* 毛玻璃内部装饰 */
        .glass-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        }

        /* 初始状态 - 空白毛玻璃 */
        .initial-state {
            text-align: center;
            padding: 80px 40px;
        }

        .initial-state .paste-hint {
            font-size: 4rem;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .initial-state .paste-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.2rem;
            font-weight: 400;
            margin-bottom: 40px;
        }

        .initial-state .paste-subtitle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            font-weight: 300;
        }

        /* 表单状态 - 隐藏初始状态 */
        .form-state {
            display: none;
        }

        .form-state.active {
            display: block;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #ffffff;
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
            font-weight: 400;
        }

        /* 表单样式 */
        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }

        .form-group {
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 16px;
            color: #ffffff;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group select option {
            background: #1a1a1a;
            color: #ffffff;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 任务列表 */
        .tasks-section {
            margin-top: 40px;
        }

        .tasks-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .tasks-header h3 {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .task {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .task:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .task-info {
            flex: 1;
        }

        .task-title {
            font-weight: 700;
            color: #ffffff;
            font-size: 1.1rem;
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .task-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .task-domain {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .task-url {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            word-break: break-all;
            flex: 1;
        }

        .copy-url-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .copy-url-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .task-status {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        .status-processing {
            background: rgba(13, 202, 240, 0.2);
            color: #0dcaf0;
        }

        .status-completed {
            background: rgba(25, 135, 84, 0.2);
            color: #198754;
        }

        .status-failed {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            border-radius: 3px;
        }

        .task-actions {
            display: flex;
            gap: 12px;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.9rem;
            border-radius: 8px;
            font-weight: 500;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-danger {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }

        .btn-danger:hover {
            background: rgba(220, 53, 69, 0.3);
        }

        .loading {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin: 40px 0;
            font-size: 1.1rem;
        }

        .message {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-weight: 500;
        }

        .error {
            background: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.2);
        }

        .success {
            background: rgba(25, 135, 84, 0.1);
            color: #198754;
            border: 1px solid rgba(25, 135, 84, 0.2);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .glass-container {
                padding: 24px;
                margin: 10px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .header h1 {
                font-size: 2.5rem;
            }

            .task-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .task-meta {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .initial-state .paste-hint {
                font-size: 3rem;
            }
        }

        /* 图标样式 */
        .icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* 粘贴提示动画 */
        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.6; }
        }

        .paste-hint {
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <!-- 抽象背景画布 -->
    <canvas id="bg-canvas"></canvas>

    <div class="main-container">
        <div class="glass-container">
            <!-- 初始状态 -->
            <div class="initial-state" id="initialState">
                <div class="paste-hint">⌘V</div>
                <div class="paste-text">粘贴视频链接开始下载</div>
                <div class="paste-subtitle">支持 Bilibili、YouTube 等主流平台</div>
            </div>

            <!-- 表单状态 -->
            <div class="form-state" id="formState">
                <div class="header">
                    <h1>🎬 Gravity</h1>
                    <p>现代化视频下载器 - 抽象艺术背景版</p>
                </div>

                <form id="downloadForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="url">视频链接</label>
                            <input type="url" id="url" name="url" placeholder="粘贴视频链接..." required>
                        </div>

                        <div class="form-group">
                            <label for="format">格式</label>
                            <select id="format" name="format">
                                <option value="best">最佳质量</option>
                                <option value="worst">最低质量</option>
                                <option value="360p">360p</option>
                                <option value="480p">480p</option>
                                <option value="720p">720p</option>
                                <option value="1080p">1080p</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="type">类型</label>
                            <select id="type" name="type">
                                <option value="video">视频</option>
                                <option value="audio">音频</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn" id="submitBtn">
                        开始下载
                    </button>
                </form>

                <div id="message"></div>

                <div class="tasks-section">
                    <div class="tasks-header">
                        <h3>下载任务</h3>
                    </div>
                    <div id="taskList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 复制图标 SVG -->
    <svg style="display: none;">
        <symbol id="copy-icon" viewBox="0 0 24 24">
            <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
        </symbol>
    </svg>

    <!-- 抽象背景库 -->
    <script src="AbstractShapeBg.min.js"></script>

    <script>
        const API_BASE = 'http://localhost:8088/api';
        let tasks = [];
        let abstractBg = null;

        // 初始化抽象背景
        function initAbstractBackground() {
            try {
                const canvas = document.getElementById('bg-canvas');
                if (typeof Color4Bg !== 'undefined' && Color4Bg.AbstractShapeBg) {
                    abstractBg = new Color4Bg.AbstractShapeBg(canvas, {
                        color: '#667eea',
                        backgroundColor: '#0a0a0a',
                        speed: 0.5,
                        density: 0.8,
                        size: 2
                    });
                    abstractBg.start();
                } else {
                    console.log('AbstractShapeBg not found, using fallback background');
                    // 备用背景
                    canvas.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                }
            } catch (error) {
                console.error('Failed to initialize abstract background:', error);
                // 备用背景
                const canvas = document.getElementById('bg-canvas');
                canvas.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
            }
        }

        // 显示消息
        function showMessage(message, type = 'success') {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }

        // 格式化状态
        function formatStatus(status) {
            const statusMap = {
                'pending': '等待中',
                'processing': '处理中',
                'completed': '已完成',
                'failed': '失败'
            };
            return statusMap[status] || status;
        }

        // 获取域名
        function getDomain(url) {
            try {
                const urlObj = new URL(url);
                return urlObj.hostname.replace('www.', '');
            } catch {
                return 'unknown';
            }
        }

        // 复制URL到剪贴板
        async function copyUrl(url) {
            try {
                await navigator.clipboard.writeText(url);
                showMessage('链接已复制到剪贴板！');
            } catch (error) {
                console.error('复制失败:', error);
                showMessage('复制失败', 'error');
            }
        }

        // 切换到表单状态
        function switchToFormState() {
            document.getElementById('initialState').style.display = 'none';
            document.getElementById('formState').classList.add('active');
        }

        // 检测粘贴事件
        function handlePaste(event) {
            const pastedText = (event.clipboardData || window.clipboardData).getData('text');
            
            // 检查是否是有效的URL
            if (pastedText && (pastedText.includes('bilibili.com') || pastedText.includes('youtube.com') || pastedText.includes('http'))) {
                // 切换到表单状态
                switchToFormState();
                
                // 设置URL到输入框
                setTimeout(() => {
                    document.getElementById('url').value = pastedText;
                    document.getElementById('url').focus();
                }, 100);
                
                showMessage('检测到视频链接，请选择下载参数');
            }
        }

        // 渲染任务列表
        function renderTasks() {
            const taskList = document.getElementById('taskList');
            if (tasks.length === 0) {
                taskList.innerHTML = '<p class="loading">暂无下载任务</p>';
                return;
            }

            taskList.innerHTML = tasks.map(task => `
                <div class="task">
                    <div class="task-header">
                        <div class="task-info">
                            <div class="task-title">${task.title}</div>
                            <div class="task-meta">
                                <span class="task-domain">${getDomain(task.url)}</span>
                                <span class="task-url">${task.url}</span>
                                <button class="copy-url-btn" onclick="copyUrl('${task.url}')" title="复制链接">
                                    <svg class="icon">
                                        <use href="#copy-icon"></use>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="task-status status-${task.status}">${formatStatus(task.status)}</div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${task.progress}%"></div>
                    </div>
                    <div class="task-actions">
                        ${task.status === 'completed' ? 
                            `<button class="btn btn-small btn-secondary" onclick="downloadFile('${task.id}')">下载文件</button>` : 
                            ''
                        }
                        <button class="btn btn-small btn-danger" onclick="deleteTask('${task.id}')">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // 创建下载任务
        async function createTask(formData) {
            try {
                const response = await fetch(`${API_BASE}/tasks`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                
                if (response.ok) {
                    showMessage('任务创建成功！');
                    tasks.unshift(result.task);
                    renderTasks();
                    return result.task;
                } else {
                    throw new Error(result.error || '创建任务失败');
                }
            } catch (error) {
                showMessage(error.message, 'error');
                throw error;
            }
        }

        // 获取任务状态
        async function getTaskStatus(taskId) {
            try {
                const response = await fetch(`${API_BASE}/tasks/${taskId}`);
                const result = await response.json();
                
                if (response.ok) {
                    return result.task;
                } else {
                    throw new Error(result.error || '获取任务状态失败');
                }
            } catch (error) {
                console.error('获取任务状态失败:', error);
                return null;
            }
        }

        // 删除任务
        async function deleteTask(taskId) {
            try {
                const response = await fetch(`${API_BASE}/tasks/${taskId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    tasks = tasks.filter(task => task.id !== taskId);
                    renderTasks();
                    showMessage('任务删除成功！');
                } else {
                    const result = await response.json();
                    throw new Error(result.error || '删除任务失败');
                }
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }

        // 下载文件 - 修复版本
        async function downloadFile(taskId) {
            try {
                console.log('开始下载文件，taskId:', taskId);
                
                // 打印所有可用的响应头
                const response = await fetch(`${API_BASE}/downloads/${taskId}`);
                console.log('Response status:', response.status);
                console.log('Response headers:');
                for (const [key, value] of response.headers.entries()) {
                    console.log(`  ${key}: ${value}`);
                }
                
                if (response.ok) {
                    // 从响应头获取文件名
                    const contentDisposition = response.headers.get('Content-Disposition');
                    console.log('Content-Disposition:', contentDisposition);
                    
                    let filename = `download-${taskId}`;
                    
                    if (contentDisposition) {
                        // 解析 filename*=UTF-8'' 格式
                        const filenameMatch = contentDisposition.match(/filename\*=UTF-8''([^;]+)/);
                        if (filenameMatch) {
                            filename = decodeURIComponent(filenameMatch[1]);
                            console.log('解析到的文件名:', filename);
                        } else {
                            // 尝试解析普通的 filename 格式
                            const simpleMatch = contentDisposition.match(/filename="([^"]+)"/);
                            if (simpleMatch) {
                                filename = simpleMatch[1];
                                console.log('解析到的文件名:', filename);
                            }
                        }
                    } else {
                        console.log('Content-Disposition 头为空，尝试从任务信息获取文件名');
                        // 如果无法从响应头获取，尝试从任务信息获取
                        const task = tasks.find(t => t.id === taskId);
                        if (task && task.file_name) {
                            filename = task.file_name;
                            console.log('从任务信息获取文件名:', filename);
                        }
                    }
                    
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    console.log('设置下载文件名:', filename);
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                    showMessage('文件下载成功！');
                } else {
                    const result = await response.json();
                    throw new Error(result.error || '下载失败');
                }
            } catch (error) {
                console.error('下载错误:', error);
                showMessage(error.message, 'error');
            }
        }

        // 更新任务状态
        async function updateTaskStatus() {
            for (let i = 0; i < tasks.length; i++) {
                const task = tasks[i];
                if (task.status !== 'completed' && task.status !== 'failed') {
                    const updatedTask = await getTaskStatus(task.id);
                    if (updatedTask) {
                        tasks[i] = updatedTask;
                    }
                }
            }
            renderTasks();
        }

        // 表单提交处理
        document.getElementById('downloadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '创建中...';

            try {
                const formData = {
                    url: document.getElementById('url').value,
                    format: document.getElementById('format').value,
                    type: document.getElementById('type').value
                };

                await createTask(formData);
                document.getElementById('downloadForm').reset();
            } catch (error) {
                console.error('创建任务失败:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '开始下载';
            }
        });

        // 定期更新任务状态
        setInterval(updateTaskStatus, 2000);

        // 页面加载时初始化
        window.addEventListener('load', async () => {
            // 初始化抽象背景
            initAbstractBackground();
            
            // 添加粘贴事件监听
            document.addEventListener('paste', handlePaste);
            
            // 获取现有任务
            try {
                const response = await fetch(`${API_BASE}/tasks`);
                const result = await response.json();
                
                if (response.ok && result.tasks && result.tasks.length > 0) {
                    tasks = result.tasks || [];
                    switchToFormState();
                    renderTasks();
                }
            } catch (error) {
                console.error('获取任务列表失败:', error);
            }
        });
    </script>
</body>
</html>
