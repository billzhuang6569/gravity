<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Gravity Video Downloader - 现代化版本</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景容器 */
        #box {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* 毛玻璃主窗口 - 增强磨砂质感 */
        .glass-container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 32px;
            padding: 60px;
            max-width: 1200px;
            width: 100%;
            min-height: 600px;
            box-shadow: 
                0 32px 64px rgba(0, 0, 0, 0.4),
                0 8px 16px rgba(0, 0, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 毛玻璃内部装饰 - 增强质感 */
        .glass-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        }

        .glass-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
            pointer-events: none;
        }

        /* 初始状态 - 纯粹的毛玻璃 */
        .initial-state {
            text-align: center;
            padding: 120px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 480px;
        }

        .initial-state .paste-hint {
            font-size: 6rem;
            color: rgba(255, 255, 255, 0.25);
            margin-bottom: 32px;
            font-weight: 200;
            letter-spacing: 4px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .initial-state .paste-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.4rem;
            font-weight: 300;
            margin-bottom: 48px;
            line-height: 1.6;
            max-width: 400px;
        }

        .initial-state .paste-subtitle {
            color: rgba(255, 255, 255, 0.3);
            font-size: 1rem;
            font-weight: 300;
            line-height: 1.5;
        }

        /* 表单状态 - 隐藏初始状态 */
        .form-state {
            display: none;
        }

        .form-state.active {
            display: block;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            color: #ffffff;
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.2rem;
            font-weight: 400;
        }

        /* 表单样式 */
        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .form-group {
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 18px 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            font-size: 16px;
            color: #ffffff;
            transition: all 0.3s ease;
            backdrop-filter: blur(20px);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .form-group select option {
            background: #1a1a1a;
            color: #ffffff;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px 36px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 任务列表 */
        .tasks-section {
            margin-top: 50px;
        }

        .tasks-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .tasks-header h3 {
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: 700;
        }

        .task {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            backdrop-filter: blur(20px);
        }

        .task:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .task-info {
            flex: 1;
        }

        .task-title {
            font-weight: 700;
            color: #ffffff;
            font-size: 1.2rem;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .task-meta {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }

        .task-domain {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .task-url {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            word-break: break-all;
            flex: 1;
        }

        .copy-url-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .copy-url-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .task-status {
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pending {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        .status-processing {
            background: rgba(13, 202, 240, 0.2);
            color: #0dcaf0;
        }

        .status-completed {
            background: rgba(25, 135, 84, 0.2);
            color: #198754;
        }

        .status-failed {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .task-actions {
            display: flex;
            gap: 14px;
        }

        .btn-small {
            padding: 10px 18px;
            font-size: 0.9rem;
            border-radius: 10px;
            font-weight: 500;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn-danger {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }

        .btn-danger:hover {
            background: rgba(220, 53, 69, 0.3);
        }

        .loading {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin: 50px 0;
            font-size: 1.2rem;
        }

        .message {
            padding: 18px 24px;
            border-radius: 16px;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .error {
            background: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.2);
        }

        .success {
            background: rgba(25, 135, 84, 0.1);
            color: #198754;
            border: 1px solid rgba(25, 135, 84, 0.2);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .glass-container {
                padding: 40px 30px;
                margin: 10px;
                min-height: 500px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .header h1 {
                font-size: 2.8rem;
            }

            .task-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
            }

            .task-meta {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .initial-state {
                padding: 80px 40px;
            }

            .initial-state .paste-hint {
                font-size: 4.5rem;
            }
        }

        /* 图标样式 */
        .icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* 粘贴提示动画 */
        @keyframes pulse {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 0.5; }
        }

        .paste-hint {
            animation: pulse 3s ease-in-out infinite;
        }

        /* 进度条闪烁动画 */
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
    </style>
</head>
<body>
    <!-- 背景容器 -->
    <div id="box"></div>

    <div class="main-container">
        <div class="glass-container">
            <!-- 初始状态 -->
            <div class="initial-state" id="initialState">
                <div class="paste-hint">⌘V</div>
                <div class="paste-text">粘贴视频链接开始下载</div>
                <div class="paste-subtitle">支持 Bilibili、YouTube 等主流平台</div>
            </div>

            <!-- 表单状态 -->
            <div class="form-state" id="formState">
                <div class="header">
                    <h1>🎬 Gravity</h1>
                    <p>现代化视频下载器 - 环境光背景版</p>
                </div>

                <form id="downloadForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="url">视频链接</label>
                            <input type="url" id="url" name="url" placeholder="粘贴视频链接..." required>
                        </div>

                        <div class="form-group">
                            <label for="format">格式</label>
                            <select id="format" name="format">
                                <option value="best">最佳质量</option>
                                <option value="worst">最低质量</option>
                                <option value="360p">360p</option>
                                <option value="480p">480p</option>
                                <option value="720p">720p</option>
                                <option value="1080p">1080p</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="type">类型</label>
                            <select id="type" name="type">
                                <option value="video">视频</option>
                                <option value="audio">音频</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn" id="submitBtn">
                        开始下载
                    </button>
                </form>

                <div id="message"></div>

                <div class="tasks-section">
                    <div class="tasks-header">
                        <h3>下载任务</h3>
                    </div>
                    <div id="taskList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 复制图标 SVG -->
    <svg style="display: none;">
        <symbol id="copy-icon" viewBox="0 0 24 24">
            <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
        </symbol>
    </svg>

    <!-- 环境光背景库 -->
    <script type="module">
        import { AmbientLightBg } from "./AmbientLightBg.module.js";

        let colorbg = new AmbientLightBg({
            dom: "box",
            colors: ["#333333","#4d545c","#c69f9f","#cd9898","#b3b3b3","#242424"],
            loop: true
        });
    </script>

    <script>
        const API_BASE = 'http://localhost:8088/api';
        let tasks = [];

        // 显示消息
        function showMessage(message, type = 'success') {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }

        // 格式化状态
        function formatStatus(status) {
            const statusMap = {
                'pending': '等待中',
                'processing': '处理中',
                'completed': '已完成',
                'failed': '失败'
            };
            return statusMap[status] || status;
        }

        // 获取域名
        function getDomain(url) {
            try {
                const urlObj = new URL(url);
                return urlObj.hostname.replace('www.', '');
            } catch {
                return 'unknown';
            }
        }

        // 复制URL到剪贴板
        async function copyUrl(url) {
            try {
                await navigator.clipboard.writeText(url);
                showMessage('链接已复制到剪贴板！');
            } catch (error) {
                console.error('复制失败:', error);
                showMessage('复制失败', 'error');
            }
        }

        // 切换到表单状态
        function switchToFormState() {
            document.getElementById('initialState').style.display = 'none';
            document.getElementById('formState').classList.add('active');
        }

        // 检测粘贴事件
        function handlePaste(event) {
            const pastedText = (event.clipboardData || window.clipboardData).getData('text');
            
            // 检查是否是有效的URL
            if (pastedText && (pastedText.includes('bilibili.com') || pastedText.includes('youtube.com') || pastedText.includes('http'))) {
                // 切换到表单状态
                switchToFormState();
                
                // 设置URL到输入框
                setTimeout(() => {
                    document.getElementById('url').value = pastedText;
                    document.getElementById('url').focus();
                }, 100);
                
                showMessage('检测到视频链接，请选择下载参数');
            }
        }

        // 渲染任务列表
        function renderTasks() {
            const taskList = document.getElementById('taskList');
            if (tasks.length === 0) {
                taskList.innerHTML = '<p class="loading">暂无下载任务</p>';
                return;
            }

            taskList.innerHTML = tasks.map(task => `
                <div class="task">
                    <div class="task-header">
                        <div class="task-info">
                            <div class="task-title">${task.title}</div>
                            <div class="task-meta">
                                <span class="task-domain">${getDomain(task.url)}</span>
                                <span class="task-url">${task.url}</span>
                                <button class="copy-url-btn" onclick="copyUrl('${task.url}')" title="复制链接">
                                    <svg class="icon">
                                        <use href="#copy-icon"></use>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="task-status status-${task.status}">${formatStatus(task.status)}</div>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${task.progress}%"></div>
                    </div>
                    <div class="task-actions">
                        ${task.status === 'completed' ? 
                            `<button class="btn btn-small btn-secondary" onclick="downloadFile('${task.id}')">下载文件</button>` : 
                            ''
                        }
                        <button class="btn btn-small btn-danger" onclick="deleteTask('${task.id}')">删除</button>
                    </div>
                </div>
            `).join('');
        }

        // 渲染初始状态的任务（如果有的话）
        function renderInitialTasks() {
            if (tasks.length > 0) {
                // 只显示最近3个任务
                const recentTasks = tasks.slice(0, 3);
                const initialState = document.getElementById('initialState');
                const existingContent = initialState.innerHTML;
                
                // 在初始状态下方添加任务列表
                initialState.innerHTML = existingContent + `
                    <div class="initial-tasks" style="margin-top: 80px;">
                        <h3 style="color: rgba(255, 255, 255, 0.8); font-size: 1.3rem; margin-bottom: 30px; text-align: center; font-weight: 300; letter-spacing: 1px;">最近任务</h3>
                        <div style="display: grid; gap: 20px; max-width: 800px; margin: 0 auto;">
                            ${recentTasks.map(task => `
                                <div class="task-card" style="
                                    background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
                                    border: 1px solid rgba(255, 255, 255, 0.15);
                                    border-radius: 20px;
                                    padding: 24px;
                                    backdrop-filter: blur(25px);
                                    position: relative;
                                    overflow: hidden;
                                    transition: all 0.3s ease;
                                    cursor: pointer;
                                " onmouseover="this.style.transform='translateY(-4px)'; this.style.boxShadow='0 12px 30px rgba(0, 0, 0, 0.3)';" 
                                   onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';">
                                    
                                    <!-- 卡片装饰 -->
                                    <div style="
                                        position: absolute;
                                        top: 0;
                                        left: 0;
                                        right: 0;
                                        height: 1px;
                                        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
                                    "></div>
                                    
                                    <!-- 状态指示器 -->
                                    <div style="
                                        position: absolute;
                                        top: 20px;
                                        right: 20px;
                                        width: 12px;
                                        height: 12px;
                                        border-radius: 50%;
                                        background: ${task.status === 'completed' ? '#198754' : task.status === 'processing' ? '#0dcaf0' : task.status === 'failed' ? '#dc3545' : '#ffc107'};
                                        box-shadow: 0 0 10px ${task.status === 'completed' ? 'rgba(25, 135, 84, 0.5)' : task.status === 'processing' ? 'rgba(13, 202, 240, 0.5)' : task.status === 'failed' ? 'rgba(220, 53, 69, 0.5)' : 'rgba(255, 193, 7, 0.5)'};
                                    "></div>
                                    
                                    <!-- 任务标题 -->
                                    <div style="
                                        font-weight: 600;
                                        color: rgba(255, 255, 255, 0.95);
                                        font-size: 1.1rem;
                                        margin-bottom: 12px;
                                        line-height: 1.4;
                                        padding-right: 40px;
                                    ">${task.title}</div>
                                    
                                    <!-- 域名标签 -->
                                    <div style="
                                        display: inline-block;
                                        background: linear-gradient(135deg, rgba(102, 126, 234, 0.2) 0%, rgba(118, 75, 162, 0.2) 100%);
                                        color: #667eea;
                                        padding: 6px 14px;
                                        border-radius: 20px;
                                        font-size: 0.8rem;
                                        font-weight: 600;
                                        text-transform: uppercase;
                                        letter-spacing: 0.5px;
                                        margin-bottom: 16px;
                                        border: 1px solid rgba(102, 126, 234, 0.3);
                                    ">${getDomain(task.url)}</div>
                                    
                                    <!-- 进度条 -->
                                    <div style="
                                        width: 100%;
                                        height: 6px;
                                        background: rgba(255, 255, 255, 0.1);
                                        border-radius: 3px;
                                        overflow: hidden;
                                        margin-bottom: 16px;
                                        position: relative;
                                    ">
                                        <div style="
                                            height: 100%;
                                            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
                                            width: ${task.progress}%;
                                            border-radius: 3px;
                                            transition: width 0.3s ease;
                                            position: relative;
                                        "></div>
                                        <div style="
                                            position: absolute;
                                            top: 0;
                                            left: 0;
                                            right: 0;
                                            bottom: 0;
                                            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
                                            animation: shimmer 2s infinite;
                                        "></div>
                                    </div>
                                    
                                    <!-- 状态和操作 -->
                                    <div style="
                                        display: flex;
                                        justify-content: space-between;
                                        align-items: center;
                                    ">
                                        <div style="
                                            color: ${task.status === 'completed' ? '#198754' : task.status === 'processing' ? '#0dcaf0' : task.status === 'failed' ? '#dc3545' : '#ffc107'};
                                            font-size: 0.85rem;
                                            font-weight: 600;
                                            text-transform: uppercase;
                                            letter-spacing: 0.5px;
                                        ">${formatStatus(task.status)}</div>
                                        
                                        <div style="display: flex; gap: 8px;">
                                            ${task.status === 'completed' ? 
                                                `<button onclick="downloadFile('${task.id}')" style="
                                                    background: linear-gradient(135deg, rgba(25, 135, 84, 0.2) 0%, rgba(25, 135, 84, 0.1) 100%);
                                                    color: #198754;
                                                    border: 1px solid rgba(25, 135, 84, 0.3);
                                                    padding: 8px 16px;
                                                    border-radius: 12px;
                                                    font-size: 0.8rem;
                                                    font-weight: 600;
                                                    cursor: pointer;
                                                    transition: all 0.3s ease;
                                                " onmouseover="this.style.background='linear-gradient(135deg, rgba(25, 135, 84, 0.3) 0%, rgba(25, 135, 84, 0.2) 100%)';" 
                                                   onmouseout="this.style.background='linear-gradient(135deg, rgba(25, 135, 84, 0.2) 0%, rgba(25, 135, 84, 0.1) 100%)';">
                                                    📥 下载
                                                </button>` : 
                                                ''
                                            }
                                            <button onclick="deleteTask('${task.id}')" style="
                                                background: linear-gradient(135deg, rgba(220, 53, 69, 0.2) 0%, rgba(220, 53, 69, 0.1) 100%);
                                                color: #dc3545;
                                                border: 1px solid rgba(220, 53, 69, 0.3);
                                                padding: 8px 16px;
                                                border-radius: 12px;
                                                font-size: 0.8rem;
                                                font-weight: 600;
                                                cursor: pointer;
                                                transition: all 0.3s ease;
                                            " onmouseover="this.style.background='linear-gradient(135deg, rgba(220, 53, 69, 0.3) 0%, rgba(220, 53, 69, 0.2) 100%)';" 
                                               onmouseout="this.style.background='linear-gradient(135deg, rgba(220, 53, 69, 0.2) 0%, rgba(220, 53, 69, 0.1) 100%)';">
                                                🗑️ 删除
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        
                        ${tasks.length > 3 ? `
                            <div style="
                                text-align: center;
                                margin-top: 30px;
                                color: rgba(255, 255, 255, 0.5);
                                font-size: 0.9rem;
                                font-weight: 300;
                            ">
                                还有 ${tasks.length - 3} 个任务，粘贴链接查看全部
                            </div>
                        ` : ''}
                    </div>
                `;
            }
        }

        // 创建下载任务
        async function createTask(formData) {
            try {
                const response = await fetch(`${API_BASE}/tasks`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();
                
                if (response.ok) {
                    showMessage('任务创建成功！');
                    tasks.unshift(result.task);
                    renderTasks();
                    return result.task;
                } else {
                    throw new Error(result.error || '创建任务失败');
                }
            } catch (error) {
                showMessage(error.message, 'error');
                throw error;
            }
        }

        // 获取任务状态
        async function getTaskStatus(taskId) {
            try {
                const response = await fetch(`${API_BASE}/tasks/${taskId}`);
                const result = await response.json();
                
                if (response.ok) {
                    return result.task;
                } else {
                    throw new Error(result.error || '获取任务状态失败');
                }
            } catch (error) {
                console.error('获取任务状态失败:', error);
                return null;
            }
        }

        // 删除任务
        async function deleteTask(taskId) {
            try {
                const response = await fetch(`${API_BASE}/tasks/${taskId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    tasks = tasks.filter(task => task.id !== taskId);
                    renderTasks();
                    showMessage('任务删除成功！');
                } else {
                    const result = await response.json();
                    throw new Error(result.error || '删除任务失败');
                }
            } catch (error) {
                showMessage(error.message, 'error');
            }
        }

        // 下载文件 - 修复版本
        async function downloadFile(taskId) {
            try {
                console.log('开始下载文件，taskId:', taskId);
                
                // 打印所有可用的响应头
                const response = await fetch(`${API_BASE}/downloads/${taskId}`);
                console.log('Response status:', response.status);
                console.log('Response headers:');
                for (const [key, value] of response.headers.entries()) {
                    console.log(`  ${key}: ${value}`);
                }
                
                if (response.ok) {
                    // 从响应头获取文件名
                    const contentDisposition = response.headers.get('Content-Disposition');
                    console.log('Content-Disposition:', contentDisposition);
                    
                    let filename = `download-${taskId}`;
                    
                    if (contentDisposition) {
                        // 解析 filename*=UTF-8'' 格式
                        const filenameMatch = contentDisposition.match(/filename\*=UTF-8''([^;]+)/);
                        if (filenameMatch) {
                            filename = decodeURIComponent(filenameMatch[1]);
                            console.log('解析到的文件名:', filename);
                        } else {
                            // 尝试解析普通的 filename 格式
                            const simpleMatch = contentDisposition.match(/filename="([^"]+)"/);
                            if (simpleMatch) {
                                filename = simpleMatch[1];
                                console.log('解析到的文件名:', filename);
                            }
                        }
                    } else {
                        console.log('Content-Disposition 头为空，尝试从任务信息获取文件名');
                        // 如果无法从响应头获取，尝试从任务信息获取
                        const task = tasks.find(t => t.id === taskId);
                        if (task && task.file_name) {
                            filename = task.file_name;
                            console.log('从任务信息获取文件名:', filename);
                        }
                    }
                    
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    console.log('设置下载文件名:', filename);
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                    showMessage('文件下载成功！');
                } else {
                    const result = await response.json();
                    throw new Error(result.error || '下载失败');
                }
            } catch (error) {
                console.error('下载错误:', error);
                showMessage(error.message, 'error');
            }
        }

        // 更新任务状态
        async function updateTaskStatus() {
            for (let i = 0; i < tasks.length; i++) {
                const task = tasks[i];
                if (task.status !== 'completed' && task.status !== 'failed') {
                    const updatedTask = await getTaskStatus(task.id);
                    if (updatedTask) {
                        tasks[i] = updatedTask;
                    }
                }
            }
            
            // 检查当前是否在初始状态
            const initialState = document.getElementById('initialState');
            const formState = document.getElementById('formState');
            
            if (initialState.style.display !== 'none') {
                // 在初始状态下，重新渲染初始任务
                renderInitialTasks();
            } else {
                // 在表单状态下，正常渲染任务列表
                renderTasks();
            }
        }

        // 表单提交处理
        document.getElementById('downloadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '创建中...';

            try {
                const formData = {
                    url: document.getElementById('url').value,
                    format: document.getElementById('format').value,
                    type: document.getElementById('type').value
                };

                await createTask(formData);
                document.getElementById('downloadForm').reset();
            } catch (error) {
                console.error('创建任务失败:', error);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '开始下载';
            }
        });

        // 定期更新任务状态
        setInterval(updateTaskStatus, 2000);

        // 页面加载时初始化
        window.addEventListener('load', async () => {
            // 添加粘贴事件监听
            document.addEventListener('paste', handlePaste);
            
            // 获取现有任务但不自动切换状态
            try {
                const response = await fetch(`${API_BASE}/tasks`);
                const result = await response.json();
                
                if (response.ok && result.tasks && result.tasks.length > 0) {
                    tasks = result.tasks || [];
                    // 不自动切换到表单状态，保持初始状态
                    renderTasks();
                    renderInitialTasks(); // 渲染初始状态的任务
                }
            } catch (error) {
                console.error('获取任务列表失败:', error);
            }
        });
    </script>
</body>
</html>
